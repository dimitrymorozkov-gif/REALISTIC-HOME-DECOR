name: Build installable Fabric mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generated resources are current
        run: python3 tools/furniture_generator/generate.py --check
      - name: Build, validate, test, and package the installable mod
        run: ./gradlew --no-daemon build
      - name: Upload installable mod and checksum
        uses: actions/upload-artifact@v4
        with:
          name: realistic-home-decor-minecraft-1.21.11
          path: |
            build/distributions/release/*.jar
            build/distributions/release/SHA256SUMS
          if-no-files-found: error
