name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check generated resources are current
        run: python3 tools/furniture_generator/generate.py --check
      - name: Build, validate assets, and test geometry
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: realistic-home-decor
          path: build/libs/*.jar
